<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Traffic Predictions · FLOWX</title>
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
  <div class="app-layout">
    <main class="main-content">
      <header class="page-header"><h2>Traffic Forecast</h2><p>Predicted congestion for the network</p></header>

      <section class="card">
        <div class="card__body">
          <div class="pred-controls">
            <button id="mode-live" class="btn">LIVE</button>
            <button id="mode-15" class="btn">+15 MIN</button>
            <button id="mode-30" class="btn">+30 MIN</button>
            <button id="mode-60" class="btn">+60 MIN</button>
          </div>
          <div id="prediction-chart" style="height:180px;margin-top:12px"></div>
        </div>
      </section>

      <section class="card">
        <div class="card__header"><div class="card__title">Prediction Map</div></div>
        <div class="card__body"><div id="prediction-map" style="height:480px"></div></div>
      </section>

      <section class="card">
        <div class="card__header"><div class="card__title">Insights & Alerts</div></div>
        <div class="card__body" id="prediction-insights"></div>
      </section>

    </main>
  </div>

  <script src="../js/app.js"></script>
  <script src="../js/predictions/predictionView.js"></script>
  <script src="../js/predictions/predictionChart.js"></script>
  <script src="../js/predictions/predictionMap.js"></script>
  <script src="../js/predictions/predictionAlerts.js"></script>
</body>
</html>
